  <!-- microsoft clarity with consent check -->
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      // Initialize no-op stub
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      c[a].loading = true;
      
      // Check if analytics consent is given
      var consentKey = 'portfolio_analytics_consent';
      var hasConsent = function() {
        try {
          return localStorage.getItem(consentKey) === 'true';
        } catch (e) {
          return false;
        }
      };
      
      // Load clarity script
      var loadClarity = function() {
        if (c[a].loading) {
          c[a].loading = false;
          t = l.createElement(r); 
          t.async = 1; 
          t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; 
          y.parentNode.insertBefore(t, y);
        }
      };
      
      // Expose utilities globally for consent banner
      c._consentManager = {
        grantAnalyticsConsent: function() {
          try {
            localStorage.setItem(consentKey, 'true');
            loadClarity();
          } catch (e) {
            console.error('Failed to set consent:', e);
          }
        },
        revokeAnalyticsConsent: function() {
          try {
            localStorage.removeItem(consentKey);
          } catch (e) {
            console.error('Failed to revoke consent:', e);
          }
        },
        hasAnalyticsConsent: hasConsent
      };
      
      // Load immediately if consent already given
      if (hasConsent()) {
        loadClarity();
      }
    })(window, document, "clarity", "script", "wkejxxj8iy");
  </script>
